name: Build Celestial
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build with Gradle
        run: cd celestial-template-1.21.11 && chmod +x gradlew && ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: Celestial-jar
          path: celestial-template-1.21.11/build/libs/*[!sources].jar
